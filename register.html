<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Firecraft Hot Sauce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/firecraft_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .form-message {
      font-size: 14px;
      margin-top: 15px;
      display: none;
      font-weight: 600;
    }
    .form-message.error {
      color: var(--auth-red);
      display: block;
    }
    .form-message.success {
      color: #2e7d32;
      display: block;
    }
  </style>
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <img src="assets/images/firecraft_logo.png" alt="Firecraft Logo">
      <span class="logo-text">Firecraft</span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-subtitle">Join Firecraft to manage your orders and recipes.</p>

      <div class="auth-social">
        <button class="btn-social">
          <i class="fa-brands fa-google" style="color: #DB4437;"></i>
          Continue with Google
        </button>
        <button class="btn-social">
          <i class="fa-brands fa-apple"></i>
          Continue with Apple
        </button>
      </div>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Create a password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirm-password', this)" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth">Register</button>
        <div id="register-msg" class="form-message"></div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </main>

  <script>
    // Theme initializer
    (function() {
      const savedTheme = localStorage.getItem('firecraftTheme');
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light-theme');
        document.body.classList.add('light-theme');
      }
    })();

    // Password Toggle
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    }

    // Form Validation & Registration
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const msg = document.getElementById('register-msg');
      
      msg.className = 'form-message'; // reset

      if (!name || !email || !password || !confirmPassword) {
        msg.textContent = 'Please fill in all fields.';
        msg.classList.add('error');
        return;
      }
      
      if (password !== confirmPassword) {
        msg.textContent = 'Passwords do not match.';
        msg.classList.add('error');
        return;
      }

      // Check if user already exists
      let users = JSON.parse(localStorage.getItem('firecraftUsers')) || {};
      if (users[email]) {
        msg.textContent = 'An account with this email already exists.';
        msg.classList.add('error');
        return;
      }

      // Save new user
      users[email] = { name: name, password: password };
      localStorage.setItem('firecraftUsers', JSON.stringify(users));

      msg.textContent = 'Account successfully registered! Redirecting to login...';
      msg.classList.add('success');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });
  </script>
</body>
</html>
